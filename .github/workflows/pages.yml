name: Check and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run browser tests
        run: npx playwright install --with-deps chromium && npm test
      - name: Check JavaScript syntax
        run: npm run check
      - name: Check linked local files
        run: test -f css/styles.css && test -f js/app.js && test -f js/storage.js && test -f js/holidays.js && test -f js/i18n.js && test -f PRIVACY.pl.md

      - name: Check Pages does not contain data files
        run: |
          ! find . -path './.git' -prune -o -type f \( -iname '*data*.json' -o -iname '*timesheet*.json' \) -print -quit | grep -q .

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static Pages site
        run: |
          mkdir site
          cp index.html PRIVACY.md PRIVACY.pl.md site/
          cp css/styles.css site/
          cp js/*.js site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
