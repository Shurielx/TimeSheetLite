name: Build Windows ZIP release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the v prefix'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Normalize version
        shell: pwsh
        run: |
          "VERSION=$($env:VERSION -replace '^v', '')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build ZIP package
        shell: pwsh
        run: .\scripts\package.ps1 -Version $env:VERSION -OutputPath "$env:GITHUB_WORKSPACE\TimeSheetLite-windows.zip"

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { "v$env:VERSION" } else { '${{ github.ref_name }}' }
          gh release create $tag "$env:GITHUB_WORKSPACE\TimeSheetLite-windows.zip#TimeSheetLite Windows ZIP" --repo '${{ github.repository }}' --generate-notes
